# =============================================================================
# CEMS 工业数据采集链路 —— 全链路一键启动
#
# 一条命令启动 8 个服务：
#   Nginx(反向代理) + Redis(查询缓存)
#   + EMQX(MQTT Broker) + TDengine(时序库)
#   + 设备层 + 网关层 + 平台接入层 + Web 展示层
#
# 用法：
#   docker compose up -d --build     # 启动（首次会构建镜像）
#   docker compose ps                # 查看状态
#   docker compose logs -f gateway   # 跟踪某个服务的日志
#   docker compose down              # 停止并删除容器（数据保留在卷里）
#   docker compose down -v           # 停止并连数据一起删除
#
# 启动后：浏览器打开 http://localhost 看实时曲线（经 nginx 反代）
#        直连后端 http://localhost:5001 仍可用（对照 nginx 层前后差异，见 §验收）
#        管理台 http://localhost:18083 看 MQTT 连接（默认 admin/public）
#
# ★ 端口默认只绑定 127.0.0.1（仅本机可访问）：
#   EMQX 1883 默认匿名可发布、TDengine 6041 用演示口令、18083 默认 admin/public，
#   一旦绑到 0.0.0.0，同一 WiFi 下任何设备都能免登录读全量数据、甚至删库。
#   nginx 的 80 同理走 BIND_ADDR —— 它前面就是这套展示面，绝不能默认对外。
#   需要在局域网演示大屏时，在 .env 里设 BIND_ADDR=0.0.0.0，
#   并且务必同时改掉 TD_PASS 与 EMQX 默认口令。
# =============================================================================

name: cems

# 四个 Python 服务共用同一镜像和网络配置，用 YAML 锚点复用。
# 注意：整个 compose 里只有 device 声明 build —— 四个服务用的是同一个镜像，
#       若每个服务都写 build，compose 会并发构建同一个镜像名而报 AlreadyExists。
x-app: &app
  image: cems-pipeline:latest
  # 这个镜像只在本机构建、不在任何 registry 上，
  # 所以要显式禁止拉取：否则新机器首次 up 会先白等一次 pull 超时/404 才回落到 build
  pull_policy: never
  restart: unless-stopped
  networks: [cems]
  # ⚠️ json-file 日志驱动默认【无上限】：容器一直输出就一直占宿主机的 Docker 盘。
  # 这里给每个服务封顶（3 个 10MB 文件 ≈ 上限 30MB/容器）。
  # 注意：YAML 合并键是逐 key 的浅合并，其余服务各自显式写一份同名配置。
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    # 时区必须与 TDengine 容器一致，否则入库时间戳会整体偏移 8 小时
    TZ: Asia/Shanghai

# =============================================================================
# 多设备（多实例路线）：第一条（默认）与第二条（`--profile plant2`）共用下面这些锚点。
#
# 为什么是"两份 service 定义 + 锚点复用 + profiles"，而不是别的写法：
#   - YAML 锚点只能把一份定义**合并进**某个服务，无法把一份定义展开成两个服务
#     （服务名、container_name、从站号、主题、缓存目录都不同）→ 必须写两份定义。
#   - 但"哪些键共用、哪些键每实例不同"必须一眼看得出来，所以共用部分抽成 x- 锚点
#     （沿用项目既有的 x-app / *logging 风格），第二套只写差异键。
#   - 用 profiles 而不是"默认把两套都起来"：默认启动面（8 个服务）是现状与验收基线；
#     第二套属"能力已具备、按需开启"。若默认起来，两台设备的数据会同时进
#     cems.cems_data，任何**不带设备过滤**的查询都会把两条曲线混在一起看
#     （scripts/verify_pipeline_live.py 已按设备 TAG 过滤，可作为正例）。
#   - 不用 `docker compose up --scale`：本链路的实例不是同构副本 ——
#     从站号、主题、client_id、缓存目录各不相同，container_name / 端口也与 scale 冲突。
#     要加第三台设备时，参照 gateway2 / subscriber2 复制一份即可；
#     N≥3 或设备需要动态增减时再考虑"单实例订阅通配 + 从主题解析设备号"
#     （取舍与边界见 docs/adr/0008-多设备多实例路线.md）。
# =============================================================================

# ---- 两个网关实例共用的环境（每实例只覆盖"这台设备是谁"那几个键）----
x-gateway-env: &gateway-env
  TZ: Asia/Shanghai
  MQTT_HOST: emqx
  MQTT_PORT: "1883"
  MQTT_QOS: "1"
  POLL_INTERVAL: "5.0"
  PUBLISH_ACK_TIMEOUT: "5.0"      # 单条等 PUBACK 的秒数，超时就转本地缓存
  RESEND_WINDOW: "100"             # 补传在途窗口条数
  RESEND_RETRY_INTERVAL: "30.0"    # 补传部分失败后的重试间隔（秒）

# ---- 网关健康检查的公共节奏（test 各实例不同：心跳文件在自己的缓存目录里）----
x-gateway-healthcheck: &gateway-healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

# ---- 两个网关实例共用的启动依赖 ----
x-gateway-depends: &gateway-depends
  emqx:
    condition: service_healthy
  device:
    condition: service_started

# ---- 两个接入实例共用的环境（每实例只覆盖 主题 / TD_PLANT / TD_DEVICE）----
x-subscriber-env: &subscriber-env
  TZ: Asia/Shanghai
  MQTT_HOST: emqx
  MQTT_PORT: "1883"
  MQTT_QOS: "1"
  # 0 = 持久会话（默认）：订阅端离线期间 broker 会为 QoS≥1 的消息排队，重连后补投
  MQTT_CLEAN_SESSION: "0"
  TD_URL: http://tdengine:6041
  # 口令从 .env 读取，未配置时回落到本机演示默认值（见 .env.example）
  TD_USER: ${TD_USER:-root}
  TD_PASS: ${TD_PASS:-taosdata}
  TD_DB: cems
  TD_STABLE: cems_data
  # ---- 排放超标告警（ADR-0002 方案乙：接入层逐条判**折算值**）----
  # 判据实现见 src/common/alarm_judge.py；参数默认值即 ADR-0002 §2.2 4) 的那一组。
  # 判定只在"入库成功"之后追加一次调用，不改拒收逻辑、不改契约、不加服务、不加依赖；
  # 折算值仍然不给 cems_data 建列，事件表里存的是**判定快照**（判定证据）。
  ALARM_ENABLE: ${ALARM_ENABLE:-1}
  ALARM_WINDOW_SAMPLES: ${ALARM_WINDOW_SAMPLES:-6}          # 滑窗 M 条有效样本
  ALARM_MIN_OVER_SAMPLES: ${ALARM_MIN_OVER_SAMPLES:-3}      # 其中至少 N 条越限才触发
  ALARM_RECOVER_RATIO: ${ALARM_RECOVER_RATIO:-0.95}         # 恢复到 限值×该系数 才算回来
  ALARM_RECOVER_SAMPLES: ${ALARM_RECOVER_SAMPLES:-6}        # 连续 K 条恢复才 END
  ALARM_REMIND_SECONDS: ${ALARM_REMIND_SECONDS:-1800}       # 事件仍 OPEN 时的提醒间隔
  ALARM_HOURLY_ENABLE: ${ALARM_HOURLY_ENABLE:-1}            # 小时结算（覆盖率三态结论）
  ALARM_HOURLY_BACKFILL_HOURS: ${ALARM_HOURLY_BACKFILL_HOURS:-2}
  ALARM_SETTLE_DELAY_SECONDS: ${ALARM_SETTLE_DELAY_SECONDS:-60}   # 整点后等补传收尾再结算
  ALARM_COVERAGE_MIN: ${ALARM_COVERAGE_MIN:-0.75}           # 低于它判数据不足，绝不判达标
  ALARM_INVALID_RATIO_MAX: ${ALARM_INVALID_RATIO_MAX:-0.10} # 无效样本占比上限（O2>=21%）
  # 折算分母下限：21-O2 小于它 ⇒ 该样本折算放大不可信（O2=20% ⇒ 15 倍），
  # 小时结算把它并入**无效样本**（与 O2>=21% 同一条路径），不新造第四种状态。
  # 默认 2.0 ⇒ 放大倍数上限 15/2 = 7.5 倍。设 0 等于关掉这条判据。
  ALARM_O2_DENOM_MIN: ${ALARM_O2_DENOM_MIN:-2.0}
  ALARM_POLL_INTERVAL: ${ALARM_POLL_INTERVAL:-5.0}          # 算 720 条/小时用，须与网关一致
  ALARM_JUDGE_VERSION: ${ALARM_JUDGE_VERSION:-v1.0.0}
  ALARM_PUSH_CHANNEL: ${ALARM_PUSH_CHANNEL:-log}
  # channel=webhook 时真的 POST 告警到该地址；留空则自动降级为只落记录
  ALARM_PUSH_URL: ${ALARM_PUSH_URL:-}
  ALARM_PUSH_TIMEOUT: ${ALARM_PUSH_TIMEOUT:-3.0}
  ALARM_STATS_LOG_SAMPLES: ${ALARM_STATS_LOG_SAMPLES:-60}
  ALARM_EVENT_STABLE: ${ALARM_EVENT_STABLE:-cems_alarm_event}
  ALARM_VERDICT_STABLE: ${ALARM_VERDICT_STABLE:-cems_hourly_verdict}
  ALARM_PUSH_STABLE: ${ALARM_PUSH_STABLE:-cems_alarm_push}

# ---- 两个接入实例共用的健康检查与启动依赖 ----
# 订阅端是事件驱动的、没有自己的端口，这里探"能否连上 broker"：
# 连不上就意味着数据进不来（进程本身死没死，看容器状态即可）
x-subscriber-healthcheck: &subscriber-healthcheck
  test: ["CMD", "python", "-c",
         "import socket;socket.create_connection(('emqx',1883),3)"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

x-subscriber-depends: &subscriber-depends
  emqx:
    condition: service_healthy
  tdengine:
    condition: service_healthy

services:

  # ---------------- 基础设施：MQTT Broker ----------------
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 持久会话的离线消息队列：订阅端离线期间 broker 为它排队，重连后补投。
      # EMQX 默认 max_mqueue_len=1000、session_expiry_interval=2h，
      # 按 5 秒/条算只能扛约 83 分钟 —— 断网更久就丢最旧的（且只在补传时才看得出来）。
      # 这里调到 20000 条（约 27 小时）+ 24 小时会话有效期；
      # 队列是占内存的，按你的断网容忍时长调，别无限放大。
      EMQX_MQTT__MAX_MQUEUE_LEN: "20000"
      EMQX_MQTT__SESSION_EXPIRY_INTERVAL: "24h"
      # ⚠️ 上面两条只解决"排队多久"，解决不了"broker 重启后队列还在不在"：
      # EMQX 的会话默认是**内存态**（durable_sessions.enable=false），
      # 容器重启/崩溃后离线队列直接消失 —— 而网关此时已拿到 broker 的 PUBACK、
      # 认为"发成功了"，于是这批数据既不在网关缓存、也没进下游 = 真丢。
      # 实测（2026-10-02，停 EMQX 容器）：两台各补传 29 条，device1 落库、
      # device2 的 29 条被丢弃（订阅端重订阅与网关补传存在竞态）。
      # 打开磁盘持久化后，会话与离线队列落到 /opt/emqx/data（已有 emqx-data 卷）。
      EMQX_DURABLE_SESSIONS__ENABLE: "true"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:1883:1883"      # MQTT 协议端口（网关发布、平台订阅）
      - "${BIND_ADDR:-127.0.0.1}:18083:18083"    # EMQX Dashboard 管理台
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging:
      <<: *logging
    networks: [cems]

  # ---------------- 基础设施：时序数据库 ----------------
  tdengine:
    image: tdengine/tdengine:latest
    container_name: tdengine
    restart: unless-stopped
    environment:
      # ★ 关键：容器时区。默认镜像是 UTC，会让本地时间字符串被当成 UTC 解析，
      #   导致库里时间比实际快 8 小时（taospy 读回时又按本地时区转换）
      TZ: Asia/Shanghai
    # ✅ 已映射端口（2026-09-29）：原先本机装的 TDengine 企业版占用 6030/6041，
    #    现已停用并卸载 → 端口释放，容器可以把 REST 端口暴露给宿主机。
    #    用途：Taos Shell / Python 脚本 / 命令行 taos 直连容器里的社区版库。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6041:6041"    # REST（Taos Shell、taosrest 用这个）
      - "${BIND_ADDR:-127.0.0.1}:6030:6030"    # 原生协议（taos CLI -Z 用）
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
      # 日志上限：容器内改 /etc/taos/* 不持久（重建就丢），所以落盘进仓库再挂进去。
      # 这两个文件不是手抄的镜像默认值，而是由 deploy/tdengine/gen-log-limits-config.ps1
      # 从镜像里取原文件 + 就地补丁生成（镜像升级后重跑该脚本即可同步）。
      # ⚠️ 只读挂载：容器无法改它，避免跑起来后配置与仓库不一致。
      - ./deploy/tdengine/taos-log-limits.cfg:/etc/taos/taos.cfg:ro
      - ./deploy/tdengine/taosadapter-log-limits.toml:/etc/taos/taosadapter.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'SHOW DATABASES;' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging:
      <<: *logging
    networks: [cems]

  # ---------------- 1 设备层：Modbus 仿真设备 ----------------
  device:
    <<: *app
    container_name: cems-device
    build: .                       # 全项目唯一的构建入口，产出 cems-pipeline:latest
    command: python src/device/modbus_server.py
    environment:
      TZ: Asia/Shanghai
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5020"
      SLAVE_ID: "1"
      # ★ 多从站：一个 TCP 服务端上同时提供多个 unit id（如 "1,2"），第二台设备就是从站 2。
      #   这对应现场最常见的形态——一条链路（一个 IP:端口）后面挂多台仪表，数采侧按 unit id 读，
      #   所以第二台设备**不需要第二个端口、第二个容器**。
      #   默认 "1" = 单从站（等价于原来的 SLAVE_ID=1，代码走 single=True 的原有路径）。
      #   开启第二台：在 .env 里设 SLAVE_IDS=1,2（并配 --profile plant2 起第二个网关/接入实例）。
      SLAVE_IDS: ${SLAVE_IDS:-1}
      # 第 n 台（n≥2）相对第 1 台的仿真相位偏移（秒），默认 10800 = 3 小时：
      # 让两台设备的曲线明显错开，一眼可辨是两台设备而不是同一条曲线。
      SLAVE_PHASE_OFFSET: ${SLAVE_PHASE_OFFSET:-10800}
      # 仿真信号：种子/时间基准/时钟偏移。同种子 + 同时间参数 => 逐值一致的输出。
      # 不设 SIM_SEED 时设备层会用确定性默认值 20261001（不是随机种子）。
      # 多从站时第 n 台的种子 = SIM_SEED + (n-1)（第 1 台仍是 SIM_SEED 本身，单设备读数不变）。
      SIM_SEED: ${SIM_SEED:-20261001}
      SIM_EPOCH: ${SIM_EPOCH:-2026-01-01T00:00:00+00:00}
      SIM_CLOCK_SKEW: ${SIM_CLOCK_SKEW:-0}
      # 污染物偶发尖峰：每个刷新周期（2 秒）触发一个尖峰的独立概率，只作用于污染物
      # （Dust/SO2/NOx）。0 = 关闭（此时污染物恒定达标，用于验证基线标定）。
      # 折算值超标由展示/告警层用 points.to_reference_o2() 现算，库里不存折算列。
      SIM_SPIKE_PROB: ${SIM_SPIKE_PROB:-0.004}
      SIM_SPIKE_ENABLE: ${SIM_SPIKE_ENABLE:-1}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5020:5020"      # 方便用 Modbus 调试工具直接看寄存器
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;socket.create_connection(('127.0.0.1',5020),2)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------- 2 网关层：轮询设备 → 发 MQTT ----------------
  # 第一套实例（现状）：从站 1 → 主题 cems/plant1/data → 缓存目录 ./data
  gateway:
    <<: *app
    container_name: cems-gateway
    command: python src/gateway/gateway.py
    environment:
      <<: *gateway-env
      MODBUS_HOST: device          # 容器内用服务名互访
      MODBUS_PORT: "5020"
      MODBUS_UNIT: "1"             # 从站地址：读设备层的第 1 个从站
      MQTT_TOPIC: cems/plant1/data
      # ⚠️ client_id 两个实例必须不同：MQTT 同名 client_id 会互相踢下线（表现为两边反复重连）
      MQTT_CLIENT_ID: cems-gateway-plant1
      # 缓存目录：不设 GATEWAY_DATA_DIR ⇒ 用默认值 PROJECT_ROOT/data（= 容器内 /app/data）。
      # 第二套实例必须显式另指一处，否则两个实例会共用 cache.jsonl / inflight-* 段文件。
    volumes:
      # 断网缓存落到宿主机，重启容器数据不丢，也方便直接看 cache.jsonl
      - ./data:/app/data
    depends_on: *gateway-depends
    healthcheck:
      # 网关没有监听端口，靠"心跳文件是否新鲜"判断采集循环有没有卡死
      <<: *gateway-healthcheck
      test: ["CMD", "python", "-c",
             "import sys,time,pathlib;p=pathlib.Path('/app/data/.gateway_alive');sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<30 else 1)"]

  # ---------------- 2b 第二套网关实例（多设备：默认不启动，`--profile plant2` 开启） ----------------
  # 与第一套的差异只有 5 个键：从站号、主题、client_id、缓存目录、容器名。
  # 启用步骤（两步，缺一不可）：
  #   1) .env 里设 SLAVE_IDS=1,2   —— 让设备层真的提供从站 2（否则本实例读不到数据）
  #   2) docker compose --profile plant2 up -d
  gateway2:
    <<: *app
    profiles: ["plant2"]
    container_name: cems-gateway-plant2
    command: python src/gateway/gateway.py
    environment:
      <<: *gateway-env
      MODBUS_HOST: device
      MODBUS_PORT: "5020"
      MODBUS_UNIT: ${MODBUS_UNIT2:-2}                          # ← 同一 TCP 服务端上的从站 2
      MQTT_TOPIC: ${MQTT_TOPIC2:-cems/plant2/data}             # 改 PLANT2 时要一起改这里
      # ⚠️ 两个实例（含网关与接入）的 client_id 必须两两不同，否则会互相踢下线；
      #    所以网关、接入各用一个独立变量，别共用同一个名字。
      MQTT_CLIENT_ID: ${GATEWAY2_CLIENT_ID:-cems-gateway-plant2}
      GATEWAY_DATA_DIR: /app/data-plant2                       # ★ 缓存每实例一份（见 gateway.py 配置区）
    volumes:
      - ./data/plant2:/app/data-plant2
    depends_on: *gateway-depends
    healthcheck:
      <<: *gateway-healthcheck
      test: ["CMD", "python", "-c",
             "import sys,time,pathlib;p=pathlib.Path('/app/data-plant2/.gateway_alive');sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<30 else 1)"]

  # ---------------- 3 平台接入层：订阅 MQTT → 写入 TDengine ----------------
  # 第一套实例（现状）：主题 cems/plant1/data → 子表 plant1_device1
  # ★ 为什么"每台设备一个接入实例"而不是"一个实例订阅通配、从主题解析设备号"：
  #   本模块带状态的东西都是**每设备一份**——判据滑窗（AlarmJudge）、最近折算值快照、
  #   持久会话 client_id，以及"一个实例只写一张子表"这个前提（_check_tags 的一致性校验
  #   也建立在这个前提上）。多实例让这些状态天然各归各的，单设备代码路径**零改动**；
  #   通配方案则要把写入器/告警表/判据状态全部改成按设备字典化，属于把现有正确路径重写一遍。
  #   代价只是多一个容器，N=2 时明显划算；边界（N≥3 / 设备动态增减）见 ADR-0008。
  subscriber:
    <<: *app
    container_name: cems-subscriber
    command: python src/platform/subscriber_to_td.py
    environment:
      <<: *subscriber-env
      MQTT_TOPIC: cems/plant1/data
      MQTT_CLIENT_ID: cems-subscriber-plant1   # 持久会话靠它认人，不要改成随机值
      TD_PLANT: plant1
      TD_DEVICE: device1
    depends_on: *subscriber-depends
    healthcheck: *subscriber-healthcheck

  # ---------------- 3b 第二套接入实例（多设备：默认不启动，`--profile plant2` 开启） ----------------
  # 与第一套的差异只有 3 个键：主题、client_id、标签（TD_PLANT/TD_DEVICE）。
  # 标签换成 plant2/device2 ⇒ 写入子表 plant2_device2，与第一套的 plant1_device1 互不覆盖；
  # 每实例一份的判据状态与折算值快照也因此天然隔离。
  subscriber2:
    <<: *app
    profiles: ["plant2"]
    container_name: cems-subscriber-plant2
    command: python src/platform/subscriber_to_td.py
    environment:
      <<: *subscriber-env
      MQTT_TOPIC: ${MQTT_TOPIC2:-cems/plant2/data}
      MQTT_CLIENT_ID: ${SUBSCRIBER2_CLIENT_ID:-cems-subscriber-plant2}   # 持久会话靠它认人
      TD_PLANT: ${PLANT2:-plant2}
      TD_DEVICE: ${DEVICE2:-device2}
    depends_on: *subscriber-depends
    healthcheck: *subscriber-healthcheck

  # ---------------- 基础设施：查询缓存（展示层专用） ----------------
  # 只被 web 服务使用：缓存"已闭合时间窗"的 TDengine 聚合结果。
  # 判据与正确性边界见 src/web/cache.py 顶部；它**不是**业务数据的真源，
  # 所以任何时刻把它整个删掉都不影响功能，只会让查询回到直连库。
  redis:
    image: redis:7-alpine
    container_name: cems-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # 淘汰策略见下方 command 注释：只存"可重建的查询结果"
    command:
      # 只存"可重建的查询结果"，因此：
      #   - maxmemory-policy 必须选 allkeys-lru：写满时淘汰最旧的缓存条目，
      #     绝不能让 Redis 因为 OOM 拒写（那会让缓存整层失效且日志噪声很大）；
      #   - 不开 AOF/RDB 持久化：重启后缓存为空是**正确的**（水位也一起没了，
      #     缓存会先停用直到重新观测到库内数据），比留着一堆旧值更安全。
      - redis-server
      - --maxmemory
      - "128mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --loglevel
      - notice
    # ⚠️ 不暴露端口：缓存只走 cems 内网被 web 访问。
    #    对外暴露 Redis 等于把"能读全量报表数据"的口子开到宿主机网络上。
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging:
      <<: *logging
    networks: [cems]

  # ---------------- 基础设施：反向代理（对外唯一入口） ----------------
  # 为什么要这一层（并发模型 / 静态资源 / TLS 终结位置）见 deploy/nginx/nginx.conf 顶部。
  nginx:
    image: nginx:alpine
    container_name: cems-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # ⚠️ 沿用 ${BIND_ADDR:-127.0.0.1}：默认只绑本机，不要图省事写 0.0.0.0
      - "${BIND_ADDR:-127.0.0.1}:${NGINX_HOST_PORT:-80}:80"
    volumes:
      # 配置**落盘进仓库**（deploy/nginx/），不是 compose 里的内联字符串：
      # 内联写法没法做语法检查（nginx -t）、没法在本地 diff、也没法单独复用。
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # 静态资源直接挂仓库里的那一份，避免仓库里出现第二份副本（迟早不同步）
      - ./src/web/static:/usr/share/nginx/html/static:ro
    depends_on:
      # condition: service_healthy 而不是 service_started：
      # 否则 nginx 会在 web 还没监听 5000 时就起来，健康检查期间对外的请求全是 502。
      web:
        condition: service_healthy
    healthcheck:
      # 探的是**本层自己的** /healthz（不代理后端，理由见 cems.conf 里的注释）；
      # 用 127.0.0.1 而不是 localhost，避免 ::1 解析差异。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      <<: *logging
    networks: [cems]

  # ---------------- 4 展示层：Flask + ECharts 大屏 ----------------
  web:
    <<: *app
    container_name: cems-web
    command: python src/web/web_dashboard.py
    environment:
      TZ: Asia/Shanghai
      TD_URL: http://tdengine:6041
      TD_USER: ${TD_USER:-root}
      TD_PASS: ${TD_PASS:-taosdata}
      TD_DB: cems
      TD_STABLE: cems_data
      # ---- 展示层设备维度（查询缓存键按设备隔离，见 src/web/cache.py 头部）----
      # 与下方 subscriber 服务的 TD_PLANT/TD_DEVICE 保持同一组取值：缓存键哈希的就是这两个值，
      # 取值不一致会让缓存命名空间与真实 tag 对不上。
      # 单设备部署下就是 plant1/device1（代码里的默认值也一样），不改变现有行为；
      # 多设备部署时每台设备起一个 web 实例，各自改成对应设备。
      TD_PLANT: plant1
      TD_DEVICE: device1
      WEB_HOST: 0.0.0.0
      WEB_PORT: "5000"
      QUERY_MINUTES: "10"
      REFRESH_SECONDS: "5"
      # ---- Redis 查询缓存（只缓存已闭合时间窗，见 src/web/cache.py） ----
      REDIS_HOST: redis            # 容器内用服务名互访
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # 一键开关：设 0 时行为完全回到"每次都查库"（用于前后对照测量）
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
      # 安全边界：查询上界必须早于"最新数据时间戳"这么多秒才允许进缓存。
      # 取值依据 = 网关补传慢路径实测 max 32.1 s（docs/性能与可靠性指标.md §4.2）。
      CACHE_MARGIN_SECONDS: ${CACHE_MARGIN_SECONDS:-60}
      # 条目 TTL：兜底失效（水位丢失 / 外部直接改库 / 超长滞后补传）
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      # ---- 报表覆盖率标记（缺数要标出来，不许消失，见 src/web/report.py 头部） ----
      # 覆盖率的分母来源：应有条数 = 窗口秒数 / 采集周期。
      # ⚠️ 必须与 gateway 的 POLL_INTERVAL 一致（上面 gateway 当前固定 "5.0"）。
      POLL_INTERVAL: ${POLL_INTERVAL:-5.0}
      # 健康判据：最近一条样本距今超过 POLL_INTERVAL × 该因子（默认 5.0 × 3 = 15 s）
      # 即判不健康（/api/health 返回 503，容器变 unhealthy，见 src/web/web_dashboard.py §4）。
      # 依据：本机实测 11~12 条/分钟（间隔均值 5.15 s），15 s 允许连续丢 2 条样本不误报。
      # ⚠️ 调大等于放宽容忍断流的时间（"绿着但没数据"的窗口变长），调小会在抖动时误报。
      HEALTH_STALE_POLL_FACTOR: ${HEALTH_STALE_POLL_FACTOR:-3}
      # 门限（0~1）：低于它判 insufficient，绝不判达标。默认 0.75 =
      # docs/告警判据设计.md §3.4 的 ALARM_COVERAGE_MIN；调到 0.84 以上会误标正常数据
      # （实测天花板 5.0/5.154 = 97.0%，干净 1 分钟窗口覆盖率 P05=91.7% / 最差 83.3%）。
      REPORT_COVERAGE_MIN: ${REPORT_COVERAGE_MIN:-0.75}
      # 缺口清单上限（只截清单，不截计数）：整段断档时避免响应体翻倍
      REPORT_GAP_MAX: ${REPORT_GAP_MAX:-200}
      # 在途样本宽限（秒）：只作用于进行中的窗口，防"刚过十几秒就说这一小时缺数"。
      # 依据 = 网关补传实测最大滞后 32.1 s（docs/性能与可靠性指标.md §4.2），取 60 s；
      # 与 CACHE_MARGIN_SECONDS 同一依据、同一取值。
      REPORT_INFLIGHT_GRACE_SECONDS: ${REPORT_INFLIGHT_GRACE_SECONDS:-60}
    ports:
      # ⚠️ 宿主机端口默认 5001 不是 5000：Windows 上 5000 常被其它进程的临时源端口占用，
      #    Docker 会报 "bind: An attempt was made to access a socket in a way forbidden by
      #    its access permissions"。原端口释放后可设 WEB_HOST_PORT=5000。
      # ⚠️ 仍沿用 BIND_ADDR（默认只绑 127.0.0.1），别为了让外网访问而把它删掉。
      # ★ 对外入口是 nginx:80；这里保留直连端口是**有意的**：
      #   它是"绕过反代"的对照通路，用来量 nginx 层本身的开销（验收第 2 条），
      #   也用于缓存统计取数（/api/cache/* 默认被 nginx 挡成 403）。
      - "${BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-5001}:5000"   # 浏览器 http://localhost:${WEB_HOST_PORT:-5001}
    depends_on:
      tdengine:
        condition: service_healthy
      redis:
        # 用 service_started 而不是 service_healthy：
        # 缓存不可用时 web 本来就能正常服务（cache.py 整层降级为直连查库），
        # 用 healthy 会把"Redis 慢一点"升级成"大屏起不来"，是本末倒置。
        condition: service_started
    healthcheck:
      # 探自己的 /api/health，并且**按 HTTP 状态判成败**：
      #   · 200 ⇒ 库连得上 **且** 数据新鲜（最近一条样本距今 <= POLL_INTERVAL × 因子）
      #   · 503 ⇒ Web 活着，但库不可达 / 最近 1 分钟无数据 / 数据陈旧 ⇒ 判**不健康**
      # ⚠️ 原来这里有一句 `except HTTPError: pass`，把 500/502/404/503 全吞成退出码 0，
      #    于是"网关断流、订阅端不入库、tag 拼错恒 0 行"这些故障全都 healthy。现在去掉了：
      #    任何异常（含 HTTPError）都让探针非零退出，容器变 unhealthy。
      test: ["CMD", "python", "-c",
             "import urllib.request as u\nu.urlopen('http://127.0.0.1:5000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  cems:
    name: cems-net

volumes:
  # 由 compose 管理（实际名字带项目前缀，如 cems_tdengine-data）：
  # 只要不执行 docker compose down -v，删容器、改配置、重建都不会丢数据
  tdengine-data:
  tdengine-log:
  emqx-data:
  emqx-log:
