# =============================================================================
# Host-form helper: give the Docker name `web` an address that reaches port 5000.
#
# Why this file exists (measured, see docs/evidence/nginx-20261018/):
#   cems.conf proxies to `http://web:5000` through a variable, so nginx resolves
#   the name via `resolver 127.0.0.11` (Docker embedded DNS) and never reads the
#   container's /etc/hosts. On a plain host the web service is a host process,
#   not a container: nothing in Docker DNS answers to `web`, so every request
#   that has to be proxied ends as 502:
#       web could not be resolved (110: Operation timed out)
#   In the compose form `web` is a real container and this helper is not used.
#
# This is a plain TCP forwarder (the stream module is built into the image):
#       5000 -> host.docker.internal:5000   (the host's web_dashboard.py)
#   It never speaks HTTP, so the outer nginx still sets X-Real-IP from the real
#   client connection and this hop does not change the proxied headers.
# =============================================================================

events {
    worker_connections 256;
}

stream {
    server {
        listen 5000;

        # Resolved once at startup from the container /etc/hosts entry created by
        #   docker run --add-host host.docker.internal:host-gateway
        proxy_pass host.docker.internal:5000;

        proxy_connect_timeout 5s;
        # Slightly above the backend's own 15 s request timeout (cems.conf), so a
        # slow-but-alive backend is closed by the backend side first.
        proxy_timeout 20s;
    }
}
