# =============================================================================
# CEMS 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 对外只有一个入口：80。后端是 cems-web 容器内的 waitress（监听 5000）。
# 静态资源 /static/ 由本层直接落盘返回，不再进 Python。
# =============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;                     # 单机部署，不校验 Host（下面仍原样透传）

    charset utf-8;
    root  /usr/share/nginx/html;

    # ---- 上游地址：变量写法让 Docker DNS 在 TTL 到期后重新解析 ----
    # 直接写 proxy_pass http://web:5000 的话，服务名只在启动时解析一次，
    # web 容器重建换 IP 后必须重启 nginx 才能恢复（否则 502）。
    set $cems_web "http://web:5000";

    # ---- 超时：与前端 fetch 的单次请求超时对齐 ----
    # 前端 FETCH_TIMEOUT_MS = 15000（src/web/web_dashboard.py 的页面脚本），
    # nginx 这边必须 >= 15 s，否则浏览器看到的是 nginx 的 504 而不是自己的超时文案。
    proxy_connect_timeout 5s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    proxy_http_version 1.1;

    # ---- 转发头：后端若以后要做"按来源限流/审计"，真源在这三个头 ----
    # 本层是**边缘节点**，前面没有可信代理，所以一律用"连接的真实对端"重写，
    # 不信任客户端自带的 X-Forwarded-*（那样等于让客户端自己声明来源 IP）。
    # 将来若在前面再加一层代理，这里要改成信任该代理的 XFF 链，见 nginx.conf 注释。
    #
    # Host 原样透传：否则后端的 url_for()/绝对链接会按 web:5000 生成，跳转后浏览器打不开
    proxy_set_header Host              $host;
    # X-Real-IP：单值、直接取自 TCP 对端
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 安全：不带 Connection 头透传（避免客户端用 hop-by-hop 头做走私）
    proxy_set_header Connection        "";

    # 响应侧：不要 nginx 自己重写重定向（端口会从 80 变成 5000，泄漏内部拓扑）
    proxy_redirect off;
    # 缓冲开着：把后端响应先收进 nginx 缓冲再吐给慢客户端，让 waitress 线程尽快释放。
    # 本项目没有 SSE/WebSocket/流式接口（大屏是 5 s 轮询的普通 JSON），
    # 所以不需要 `proxy_buffering off`。
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ======================= 1. 健康检查（本层自己答，不代理） =======================
    # 判据只看"nginx 进程能不能正常收并发响应"，不去探后端：
    # 后端挂了属于 web 服务的 healthcheck 该报的事，混在一起会让两个服务同时红，
    # 排障时分不清是哪一层的问题。
    location = /healthz {
        access_log off;
        # 必须显式给 text/plain：`return` 的响应不带 Content-Type，
        # nginx 会按 default_type application/octet-stream 填一个 —— 探活工具看着像二进制。
        default_type text/plain;
        return 200 "ok\n";
    }

    # ======================= 2. 静态资源（本层直接落盘） =======================
    # /static/ 挂的是仓库里的 src/web/static（见 docker-compose.yml 的 volumes），
    # 不往仓库里再复制一份副本 —— 两份静态资源迟早会不同步。
    location /static/ {
        access_log off;
        limit_conn api_conn 32;
        # 1 年不可变缓存；ECharts 升级时改文件名即可（文件名带版本是常规做法）
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 关掉上游访问日志噪声：静态资源不进 Python
        try_files $uri =404;
    }

    # ======================= 3. 内部接口不对公网暴露 =======================
    # /api/cache/* 是给测量脚本和排障用的：会给出内部计数、水位与缓存键数量。
    # 直连 web 容器端口取数即可（测量脚本就是这么做的），对外一律 403。
    location /api/cache/ {
        access_log off;
        return 403;
    }

    # ======================= 4. 业务接口 + 页面 =======================
    location / {
        limit_req  zone=api_limit burst=80 nodelay;
        limit_conn api_conn 32;
        proxy_pass $cems_web;
    }
}
