# =============================================================================
# CEMS 反向代理 —— nginx 主配置（容器内 /etc/nginx/nginx.conf）
#
# 为什么要有这一层（不是"计划里写了"）：
#
# 1) 并发模型不匹配。后端是 waitress，工作线程数 `WEB_THREADS=8`（见
#    src/web/web_dashboard.py）。这是**进程内线程池**：第 9 个并发请求会在内核
#    的 accept 队列里排队，慢客户端（手机弱网、大屏机器休眠再唤醒）会一直占着
#    一个线程。nginx 是事件驱动，可以用极小的内存把成百上千个慢连接"挂住"，
#    只在后端真正能处理时才把请求转过去 —— 后端线程不再被慢客户端消耗。
#
# 2) 静态资源不该走 Python。`/static/echarts.min.js` 有 1 024 740 字节，
#    走 waitress 时每个字节都要过一次 Python 的 WSGI 循环；nginx 用 sendfile
#    直接由内核从页缓存拷到 socket，并支持 gzip / If-None-Match（304）。
#
# 3) TLS 终结位置要提前定下来。将来上 HTTPS 只在**这一层**加证书，
#    后端继续跑明文 HTTP；否则证书要同时装到 web 容器里，轮换时得重建业务镜像。
#
# 4) 后端端口不再对外。宿主机只需要暴露 80 一个入口，"后端地址/端口"从对外契约
#    里消失，改后端端口不需要动防火墙和任何外部调用方。
#
# ⚠️ 端口绑定沿用 compose 里的 ${BIND_ADDR:-127.0.0.1}：
#    nginx 本身绝不能默认绑到 0.0.0.0 —— 它前面挂的正是"匿名可发布"的 EMQX、
#    演示口令的 TDengine 这类东西的下游展示面，默认只给本机看。
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志不含请求体；上游耗时单独记（$upstream_response_time），
    # 这样"客户端感知的慢"与"后端真的慢"可以分开看。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # 不回显 nginx 版本号

    # 大屏只返回 JSON/HTML，gzip 主要省静态资源（1 MB 的 echarts）。
    # gzip_vary 必须开：否则中间缓存会把"gzip 过的"发给不支持 gzip 的客户端。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml image/svg+xml;

    # 转发头一共 5 个，加上 nginx 内置头会超过默认的 512 项散列容量，
    # 不显式放大就会在 nginx -t 时报 "could not build optimal proxy_headers_hash"。
    proxy_headers_hash_max_size   1024;
    proxy_headers_hash_bucket_size 64;

    # 后端地址：用变量 + Docker 内置 DNS，而不是 upstream 块。
    # 原因：upstream 块在 nginx 启动时解析一次服务名并永久缓存 IP；
    # web 容器一旦重建（改代码后的常规操作）IP 会变，nginx 若不重启就会 502。
    # 用 resolver + 变量后，TTL 到期自动重新解析。代价是丢掉了 upstream 的
    # keepalive 连接池 —— 本场景（单机、个位数 QPS）不值得为它牺牲可运维性。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # 并发保护：后端 8 个线程（waitress WEB_THREADS=8）排不下更多请求，
    # 与其让它们在 waitress 的 accept 队列里无声堆积，不如在 nginx 侧限住并明确回 429。
    # 数值是**远高于真实负载的上限**，不是给正常用户设的门槛：
    #   实测大屏刷新 5 s 一轮、一轮 2 个请求（/api/data + 静态资源 304），约 0.4 r/s；
    #   限 40 r/s、单 IP 并发 32，正常使用打不到，只在脚本刷接口/被扫时才拦。
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
